name: CI

# CI volutamente minima: lint e test sul route-engine, che esiste da
# TASK-010, e sugli script di tools/ (TASK-019); da TASK-020, lint, formato,
# tipi e test dell'app e dei tipi condivisi (job "mobile"); da TASK-022,
# lint e test dell'API (job "api"); da TASK-030, lint e test del pacchetto
# dell'AI (job "ai"), senza nessun modello vero.
# La cache di pip ha per chiave il pyproject.toml del route-engine: finché
# le dipendenze non cambiano, OSMnx e il resto non si riscaricano a ogni run.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  route-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/route-engine/pyproject.toml

      - name: Install
        working-directory: services/route-engine
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        working-directory: services/route-engine
        run: |
          ruff check .
          black --check .

      # I test marcati "network" restano esclusi: dipendono da dati esterni
      # e fallirebbero per motivi che non riguardano il codice.
      # Vedi docs/TESTING.md.
      - name: Test
        working-directory: services/route-engine
        run: pytest -m "not network"

      # Gli script di tools/ usano solo la libreria standard: bastano gli
      # strumenti già installati sopra, con le regole del route-engine.
      - name: Tools
        run: |
          ruff check --config services/route-engine/pyproject.toml tools
          black --check --config services/route-engine/pyproject.toml tools
          pytest tools

  # L'API FastAPI, installata insieme al route-engine che espone (ADR-0030).
  # I test girano sul grafo piccolo di Levico e sui JSON di shared-types.
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            services/route-engine/pyproject.toml
            services/ai/pyproject.toml
            services/api/pyproject.toml

      - name: Install
        working-directory: services/api
        run: |
          python -m pip install --upgrade pip
          pip install -e ../route-engine -e ../ai -e ".[dev]"

      - name: Lint
        working-directory: services/api
        run: |
          ruff check .
          black --check .

      - name: Test
        working-directory: services/api
        run: pytest -m "not network"

  # Il pacchetto che legge le parole della forma (ADR-0012): solo libreria
  # standard. I test usano un modello finto e un server HTTP locale finto;
  # Ollama non c'è, e measure_phrases.py non gira qui.
  ai:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/ai/pyproject.toml

      - name: Install
        working-directory: services/ai
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        working-directory: services/ai
        run: |
          ruff check .
          black --check .

      - name: Test
        working-directory: services/ai
        run: pytest -m "not network"

  # App Expo e packages/shared-types, workspace npm dalla radice (ADR-0028).
  # La cache di npm ha per chiave package-lock.json.
  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: |
          npm run lint
          npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

  # L'immagine Docker dell'API (TASK-081, ADR-0076): si costruisce e si
  # prova che risponde a /health, con e senza chiave; non si pubblica.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: docker build -t shaperoute-api:ci .

      - name: Smoke test
        run: |
          docker run -d --name api -p 8000:8000 \
            -e SHAPEROUTE_API_KEY=ci-key-only-for-this-run shaperoute-api:ci
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/health && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:8000/health
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/docs)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' \
            -H 'X-API-Key: ci-key-only-for-this-run' http://127.0.0.1:8000/docs)" = 200

      - name: Log
        if: always()
        run: docker logs api || true
