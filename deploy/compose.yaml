# ShapeRoute on a server: the API, and when wanted the AI and HTTPS
# (TASK-144, ADR-0111). docs/DEPLOY.md, road F, says how to use it.
#
#   cd deploy
#   docker compose up -d --build                     # the API
#   docker compose --profile ai up -d --build        # + Ollama, the AI
#   docker compose --profile public up -d --build    # + Caddy, HTTPS
#
# The secrets come from deploy/.env, a copy of .env.example that never
# enters the repository. Zones, search events and the request log stay in
# data/ at the root of the checkout: plain folders, so rsync can fill them
# from the Mac, and they outlive every new image.

name: shaperoute

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # The API runs as uid 10001 (Dockerfile) and must own its folders, also
  # after rsync has copied zones in as another user. Making them here, and
  # not leaving it to Docker, keeps them from being born root's.
  data-owner:
    image: busybox:1.36
    command:
      - sh
      - -c
      - mkdir -p /data/cache /data/insights /data/requests && chown -R 10001:10001 /data
    volumes:
      - ../data:/data
    logging: *logging

  api:
    build:
      context: ..
    image: shaperoute-api
    restart: unless-stopped
    depends_on:
      data-owner:
        condition: service_completed_successfully
    env_file: .env
    environment:
      # Caddy puts the phone's address in X-Forwarded-For: trusting it
      # keeps the rate limit per phone, not one for everybody. Nothing
      # else reaches the API: its port is on 127.0.0.1 only.
      FORWARDED_ALLOW_IPS: "*"
    # Without the ai profile the name ollama does not resolve, and words
    # outside the table answer ai_unavailable, as with Ollama off.
    command:
      - python
      - -m
      - shaperoute_api
      - --lan
      - --ai-url
      - http://ollama:11434
    volumes:
      - ../data/cache:/app/data/cache
      - ../data/insights:/app/data/insights
      - ../data/requests:/app/data/requests
      # The image has no catalog/: without it Explore has no routes.
      - ../catalog:/app/catalog:ro
    ports:
      # Never 0.0.0.0: Docker would open it past the firewall. tailscale
      # serve reaches it here, Caddy through Docker's own network.
      - "127.0.0.1:8000:8000"
    logging: *logging

  ollama:
    image: ollama/ollama
    profiles: ["ai"]
    restart: unless-stopped
    volumes:
      - ollama:/root/.ollama
    logging: *logging

  caddy:
    image: caddy:2
    profiles: ["public"]
    restart: unless-stopped
    depends_on:
      - api
    environment:
      SHAPEROUTE_DOMAIN: ${SHAPEROUTE_DOMAIN:-}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    logging: *logging

volumes:
  ollama:
  caddy-data:
  caddy-config:
