name: CI

# CI volutamente minima: lint e test sul route-engine.
# Si estende in fase 2, quando ci sarà l'app da costruire.
# Una CI complicata su un repository quasi vuoto è solo tempo speso a far
# passare build.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  route-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Finché il pacchetto non esiste (prima di TASK-010) il job passa
      # senza fare nulla: serve che main sia protetto da una CI verde fin
      # dal primo giorno.
      - name: Check if route-engine exists
        id: check
        run: |
          if [ -f services/route-engine/pyproject.toml ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "route-engine non ancora presente: niente da verificare."
          fi

      - uses: actions/setup-python@v5
        if: steps.check.outputs.exists == 'true'
        with:
          python-version: "3.11"

      - name: Install
        if: steps.check.outputs.exists == 'true'
        working-directory: services/route-engine
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        if: steps.check.outputs.exists == 'true'
        working-directory: services/route-engine
        run: |
          ruff check .
          black --check .

      # I test marcati "network" restano esclusi: dipendono da dati esterni
      # e fallirebbero per motivi che non riguardano il codice.
      # Vedi docs/TESTING.md.
      - name: Test
        if: steps.check.outputs.exists == 'true'
        working-directory: services/route-engine
        run: pytest -m "not network"
