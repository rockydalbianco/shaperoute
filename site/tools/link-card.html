     logo as a route, on streets that are no place: no map tiles, nothing of
     any post. Approved by the user on 2026-11-21. To make it again, from the
     repository's root (Chrome writes where it can: a folder on the Mac's own
     disk, then copy):
       "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" \
         --headless=new --hide-scrollbars --force-device-scale-factor=1 \
         --window-size=1200,630 --screenshot=/tmp/link-card.png \
         "file://$PWD/site/tools/link-card.html"

<script>
// Streets that are no place: a fixed seed, so the card is always the same.
let seed = 455;
function rnd(){ seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }
const NS = "http://www.w3.org/2000/svg";
const g = document.getElementById("streets");
function add(tag, attrs){ const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); g.appendChild(e); return e; }
const xs = [], ys = [];
for (let x = -260; x < 1460; x += 44 + rnd() * 34) xs.push(x);
for (let y = -320; y < 950; y += 40 + rnd() * 30) ys.push(y);
// A few parks.
for (let i = 0; i < 5; i++) {
  const a = 2 + Math.floor(rnd() * (xs.length - 6)), b = 2 + Math.floor(rnd() * (ys.length - 6));
  add("rect", { x: xs[a] + 4, y: ys[b] + 4, width: xs[a + 2] - xs[a] - 8, height: ys[b + 2] - ys[b] - 8, rx: 6, fill: "#0f1711" });
}
// The river.
add("path", { d: "M -300 250 C 120 150, 300 420, 560 360 S 980 120, 1500 330", fill: "none", stroke: "#1d3c4e", "stroke-width": 50, "stroke-linecap": "round", "stroke-opacity": 0.55 });
add("path", { d: "M -300 250 C 120 150, 300 420, 560 360 S 980 120, 1500 330", fill: "none", stroke: "#101f29", "stroke-width": 44, "stroke-linecap": "round" });
const minor = { stroke: "#1f1f24", "stroke-width": 3.2, "stroke-linecap": "round" };
const main = { stroke: "#2b2b31", "stroke-width": 7, "stroke-linecap": "round" };
xs.forEach((x, i) => {
  const big = i % 5 === 2;
  for (let j = 0; j < ys.length - 1; j++) {
    if (!big && rnd() < 0.2) continue;
    add("line", { x1: x, y1: ys[j], x2: x, y2: ys[j + 1], ...(big ? main : minor) });
  }
});
ys.forEach((y, j) => {
  const big = j % 6 === 3;
  for (let i = 0; i < xs.length - 1; i++) {
    if (!big && rnd() < 0.2) continue;
    add("line", { x1: xs[i], y1: y, x2: xs[i + 1], y2: y, ...(big ? main : minor) });
  }
});
// One avenue across the grid.
add("line", { x1: -260, y1: 760, x2: 1460, y2: -40, ...main, "stroke-width": 8 });
</script>
