name: CI

# CI volutamente minima: lint e test sul route-engine, che esiste da
# TASK-010, e sugli script di tools/ (TASK-019). Si estende in fase 2,
# quando ci sarà l'app da costruire.
# La cache di pip ha per chiave il pyproject.toml del route-engine: finché
# le dipendenze non cambiano, OSMnx e il resto non si riscaricano a ogni run.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  route-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/route-engine/pyproject.toml

      - name: Install
        working-directory: services/route-engine
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        working-directory: services/route-engine
        run: |
          ruff check .
          black --check .

      # I test marcati "network" restano esclusi: dipendono da dati esterni
      # e fallirebbero per motivi che non riguardano il codice.
      # Vedi docs/TESTING.md.
      - name: Test
        working-directory: services/route-engine
        run: pytest -m "not network"

      # Gli script di tools/ usano solo la libreria standard: bastano gli
      # strumenti già installati sopra, con le regole del route-engine.
      - name: Tools
        run: |
          ruff check --config services/route-engine/pyproject.toml tools
          black --check --config services/route-engine/pyproject.toml tools
          pytest tools
